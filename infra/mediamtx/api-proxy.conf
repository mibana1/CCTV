events {}

http {
  access_log off;
  server_tokens off;

  server {
    listen 172.31.255.2:19997;
    client_max_body_size 16k;

    location / {
      allow 172.31.255.3;
      deny all;
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
      proxy_set_header Host 127.0.0.1;
      proxy_pass http://127.0.0.1:9997;
    }
  }
}
