logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s

api: true
apiAddress: 127.0.0.1:9997

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
hls: true
hlsAddress: :8888
webrtc: false
srt: false
moq: false

paths:
  camera:
    # Compose overrides this with CCTV_RTSP_INPUT_URL when a real camera is used.
    source: publisher
    rtspTransport: tcp
  analyzed:
    # Reserved for the later overlay/encode publisher.
    source: publisher
