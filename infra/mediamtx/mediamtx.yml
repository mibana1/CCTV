logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
hls: false
webrtc: false
srt: false
moq: false

paths:
  camera:
    # Compose overrides this with CCTV_RTSP_INPUT_URL when a real camera is used.
    source: publisher
    rtspTransport: tcp
  analyzed:
    # Reserved for the later overlay/encode publisher.
    source: publisher
