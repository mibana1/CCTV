name: cctv-test

services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    environment:
      MTX_PATHS_CAMERA_SOURCE: ${CCTV_RTSP_INPUT_URL:-publisher}
      MTX_PATHS_CAMERA_SOURCEONDEMAND: "false"
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:18888:8888"
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    networks:
      default:
      mediamtx-control:
        ipv4_address: 172.31.255.2

  mediamtx-api-proxy:
    image: nginx:1.29-alpine
    network_mode: service:mediamtx
    command:
      - /bin/sh
      - /opt/cctv/api-proxy-run.sh
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - ./infra/mediamtx/api-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./infra/mediamtx/api-proxy-run.sh:/opt/cctv/api-proxy-run.sh:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      CCTV_APP_ENV: development
      CCTV_APP_MODE: ${CCTV_APP_MODE:-dry_run}
      CCTV_AI_DEVICE: ${CCTV_AI_DEVICE:-cpu}
      CCTV_ANALYSIS_FPS: ${CCTV_ANALYSIS_FPS:-2}
      CCTV_DETECTOR_ENABLED: ${CCTV_DETECTOR_ENABLED:-false}
      CCTV_DETECTOR_TYPE: ${CCTV_DETECTOR_TYPE:-yolo_onnx}
      CCTV_DETECTOR_INPUT_SIZE: ${CCTV_DETECTOR_INPUT_SIZE:-${CCTV_YOLO_INPUT_SIZE:-640}}
      CCTV_DETECTOR_CONFIDENCE_THRESHOLD: ${CCTV_DETECTOR_CONFIDENCE_THRESHOLD:-${CCTV_YOLO_CONFIDENCE_THRESHOLD:-0.25}}
      CCTV_DETECTOR_NMS_THRESHOLD: ${CCTV_DETECTOR_NMS_THRESHOLD:-${CCTV_YOLO_NMS_THRESHOLD:-0.45}}
      CCTV_DETECTION_CLASS_NAMES: ${CCTV_DETECTION_CLASS_NAMES:-person,car,cat,dog}
      CCTV_YOLO_ENABLED: ${CCTV_YOLO_ENABLED:-false}
      CCTV_YOLO_INPUT_SIZE: ${CCTV_YOLO_INPUT_SIZE:-640}
      CCTV_YOLO_CONFIDENCE_THRESHOLD: ${CCTV_YOLO_CONFIDENCE_THRESHOLD:-0.25}
      CCTV_YOLO_NMS_THRESHOLD: ${CCTV_YOLO_NMS_THRESHOLD:-0.45}
      CCTV_TRACKING_ENABLED: ${CCTV_TRACKING_ENABLED:-true}
      CCTV_TRACKER_CLASS_NAMES: ${CCTV_TRACKER_CLASS_NAMES:-person}
      CCTV_TRACKER_IOU_THRESHOLD: ${CCTV_TRACKER_IOU_THRESHOLD:-0.3}
      CCTV_TRACKER_MAX_MISSED_FRAMES: ${CCTV_TRACKER_MAX_MISSED_FRAMES:-10}
      CCTV_TRACKER_MAX_IDLE_SECONDS: ${CCTV_TRACKER_MAX_IDLE_SECONDS:-12}
      CCTV_PERSIST_DETECTIONS: ${CCTV_PERSIST_DETECTIONS:-true}
      CCTV_RULES_ENABLED: ${CCTV_RULES_ENABLED:-true}
      CCTV_HIPERWALL_DRY_RUN_ENABLED: ${CCTV_HIPERWALL_DRY_RUN_ENABLED:-true}
      CCTV_HIPERWALL_EXECUTOR_ENABLED: "true"
      CCTV_LOG_LEVEL: ${CCTV_LOG_LEVEL:-INFO}
      CCTV_LOG_PATH: /runtime/logs/cctv.jsonl
      CCTV_LOG_MAX_BYTES: ${CCTV_LOG_MAX_BYTES:-10485760}
      CCTV_LOG_BACKUP_COUNT: ${CCTV_LOG_BACKUP_COUNT:-5}
      CCTV_DATABASE_PATH: /runtime/cctv.db
      CCTV_MODEL_PATH: /models/model.onnx
      CCTV_MODEL_CLASSES_PATH: ${CCTV_MODEL_CLASSES_PATH:-}
      CCTV_IDENTITY_PHOTO_DIR: /runtime/identity_images
      CCTV_FACE_DETECTION_MODEL_PATH: /models/face/face_detection_yunet_2026may.onnx
      CCTV_FACE_EMBEDDING_MODEL_PATH: /models/face/face_recognition_sface_2021dec.onnx
      CCTV_FACE_DETECTION_SCORE_THRESHOLD: ${CCTV_FACE_DETECTION_SCORE_THRESHOLD:-0.8}
      CCTV_FACE_DETECTION_NMS_THRESHOLD: ${CCTV_FACE_DETECTION_NMS_THRESHOLD:-0.3}
      CCTV_FACE_DETECTION_TOP_K: ${CCTV_FACE_DETECTION_TOP_K:-5000}
      CCTV_FACE_DETECTION_MAX_INPUT_DIMENSION: ${CCTV_FACE_DETECTION_MAX_INPUT_DIMENSION:-960}
      CCTV_FACE_MATCHING_ENABLED: ${CCTV_FACE_MATCHING_ENABLED:-false}
      CCTV_FACE_MATCH_SIMILARITY_THRESHOLD: ${CCTV_FACE_MATCH_SIMILARITY_THRESHOLD:-0.45}
      CCTV_FACE_MATCH_MINIMUM_MARGIN: ${CCTV_FACE_MATCH_MINIMUM_MARGIN:-0.05}
      CCTV_FACE_MATCH_UNKNOWN_RETRY_SECONDS: ${CCTV_FACE_MATCH_UNKNOWN_RETRY_SECONDS:-2}
      CCTV_FACE_IDENTITY_STITCH_MAX_GAP_SECONDS: ${CCTV_FACE_IDENTITY_STITCH_MAX_GAP_SECONDS:-12}
      CCTV_FACE_IDENTITY_STITCH_MIN_SIMILARITY: ${CCTV_FACE_IDENTITY_STITCH_MIN_SIMILARITY:-0.35}
      CCTV_FACE_IDENTITY_STITCH_MAX_DISTANCE_RATIO: ${CCTV_FACE_IDENTITY_STITCH_MAX_DISTANCE_RATIO:-6}
      CCTV_TEST_DASHBOARD_ENABLED: ${CCTV_TEST_DASHBOARD_ENABLED:-true}
      CCTV_MEDIA_HLS_BASE_URL: ${CCTV_MEDIA_HLS_BASE_URL:-http://127.0.0.1:18888}
      CCTV_MEDIAMTX_DYNAMIC_PATHS_ENABLED: ${CCTV_MEDIAMTX_DYNAMIC_PATHS_ENABLED:-true}
      CCTV_MEDIAMTX_API_URL: http://172.31.255.2:19997
      CCTV_MEDIAMTX_API_TIMEOUT_SECONDS: ${CCTV_MEDIAMTX_API_TIMEOUT_SECONDS:-5}
      CCTV_MEDIAMTX_RECONCILE_INTERVAL_SECONDS: ${CCTV_MEDIAMTX_RECONCILE_INTERVAL_SECONDS:-10}
      CCTV_CAMERA_CREDENTIAL_KEY: ${CCTV_CAMERA_CREDENTIAL_KEY:-}
      CCTV_CAMERA_CREDENTIAL_KEY_PATH: /runtime/secrets/camera_credentials.key
      CCTV_RTSP_WORKER_URL: rtsp://mediamtx:8554/camera
      HIPERWALL_BASE_URL: ${HIPERWALL_BASE_URL:-}
      HIPERWALL_AUTH_MODE: ${HIPERWALL_AUTH_MODE:-none}
      HIPERWALL_USER: ${HIPERWALL_USER:-}
      HIPERWALL_TOKEN: ${HIPERWALL_TOKEN:-}
      HIPERWALL_TIMEOUT_SECONDS: ${HIPERWALL_TIMEOUT_SECONDS:-3}
      HIPERWALL_POLL_INTERVAL_SECONDS: ${HIPERWALL_POLL_INTERVAL_SECONDS:-0.5}
      HIPERWALL_MAX_ATTEMPTS: ${HIPERWALL_MAX_ATTEMPTS:-8}
      HIPERWALL_RETRY_BASE_SECONDS: ${HIPERWALL_RETRY_BASE_SECONDS:-5}
      HIPERWALL_RETRY_MAX_SECONDS: ${HIPERWALL_RETRY_MAX_SECONDS:-300}
      HIPERWALL_DEFAULT_DISPLAY_SECONDS: ${HIPERWALL_DEFAULT_DISPLAY_SECONDS:-30}
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./runtime:/runtime
      - ./artifacts/models:/models:ro
    depends_on:
      mediamtx:
        condition: service_started
      mediamtx-api-proxy:
        condition: service_started
    networks:
      default:
      mediamtx-control:
        ipv4_address: 172.31.255.3
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: 5173
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  local-video-worker:
    profiles:
      - local-video
    build:
      context: ./backend
    command:
      - uv
      - run
      - --no-sync
      - cctv-local-worker
      - --save-snapshots
      - --max-samples
      - ${LOCAL_VIDEO_MAX_SAMPLES:-10}
    environment:
      CCTV_APP_ENV: development
      CCTV_APP_MODE: ${CCTV_APP_MODE:-dry_run}
      CCTV_AI_DEVICE: cpu
      CCTV_ANALYSIS_FPS: ${CCTV_ANALYSIS_FPS:-2}
      CCTV_DETECTOR_ENABLED: ${CCTV_DETECTOR_ENABLED:-false}
      CCTV_DETECTOR_TYPE: ${CCTV_DETECTOR_TYPE:-yolo_onnx}
      CCTV_DETECTOR_INPUT_SIZE: ${CCTV_DETECTOR_INPUT_SIZE:-${CCTV_YOLO_INPUT_SIZE:-640}}
      CCTV_DETECTOR_CONFIDENCE_THRESHOLD: ${CCTV_DETECTOR_CONFIDENCE_THRESHOLD:-${CCTV_YOLO_CONFIDENCE_THRESHOLD:-0.25}}
      CCTV_DETECTOR_NMS_THRESHOLD: ${CCTV_DETECTOR_NMS_THRESHOLD:-${CCTV_YOLO_NMS_THRESHOLD:-0.45}}
      CCTV_DETECTION_CLASS_NAMES: ${CCTV_DETECTION_CLASS_NAMES:-person,car,cat,dog}
      CCTV_YOLO_ENABLED: ${CCTV_YOLO_ENABLED:-false}
      CCTV_YOLO_INPUT_SIZE: ${CCTV_YOLO_INPUT_SIZE:-640}
      CCTV_YOLO_CONFIDENCE_THRESHOLD: ${CCTV_YOLO_CONFIDENCE_THRESHOLD:-0.25}
      CCTV_YOLO_NMS_THRESHOLD: ${CCTV_YOLO_NMS_THRESHOLD:-0.45}
      CCTV_TRACKING_ENABLED: ${CCTV_TRACKING_ENABLED:-true}
      CCTV_TRACKER_CLASS_NAMES: ${CCTV_TRACKER_CLASS_NAMES:-person}
      CCTV_TRACKER_IOU_THRESHOLD: ${CCTV_TRACKER_IOU_THRESHOLD:-0.3}
      CCTV_TRACKER_MAX_MISSED_FRAMES: ${CCTV_TRACKER_MAX_MISSED_FRAMES:-10}
      CCTV_TRACKER_MAX_IDLE_SECONDS: ${CCTV_TRACKER_MAX_IDLE_SECONDS:-12}
      CCTV_PERSIST_DETECTIONS: ${CCTV_PERSIST_DETECTIONS:-true}
      CCTV_RULES_ENABLED: ${CCTV_RULES_ENABLED:-true}
      CCTV_HIPERWALL_DRY_RUN_ENABLED: ${CCTV_HIPERWALL_DRY_RUN_ENABLED:-true}
      CCTV_HIPERWALL_EXECUTOR_ENABLED: "false"
      HIPERWALL_DEFAULT_DISPLAY_SECONDS: ${HIPERWALL_DEFAULT_DISPLAY_SECONDS:-30}
      CCTV_MODEL_PATH: /models/${YOLO_MODEL_FILE:-model.onnx}
      CCTV_MODEL_CLASSES_PATH: ${CCTV_MODEL_CLASSES_PATH:-}
      CCTV_LOCAL_VIDEO_PATH: /samples/${LOCAL_VIDEO_FILE:-testvideo1.mp4}
      CCTV_DATABASE_PATH: /runtime/cctv.db
      CCTV_SNAPSHOT_DIR: /runtime/snapshots
      CCTV_SNAPSHOT_JPEG_QUALITY: ${CCTV_SNAPSHOT_JPEG_QUALITY:-90}
      CCTV_FACE_DETECTION_MODEL_PATH: /models/face/face_detection_yunet_2026may.onnx
      CCTV_FACE_EMBEDDING_MODEL_PATH: /models/face/face_recognition_sface_2021dec.onnx
      CCTV_FACE_DETECTION_SCORE_THRESHOLD: ${CCTV_FACE_DETECTION_SCORE_THRESHOLD:-0.8}
      CCTV_FACE_DETECTION_NMS_THRESHOLD: ${CCTV_FACE_DETECTION_NMS_THRESHOLD:-0.3}
      CCTV_FACE_DETECTION_TOP_K: ${CCTV_FACE_DETECTION_TOP_K:-5000}
      CCTV_FACE_DETECTION_MAX_INPUT_DIMENSION: ${CCTV_FACE_DETECTION_MAX_INPUT_DIMENSION:-960}
      CCTV_FACE_MATCHING_ENABLED: ${CCTV_FACE_MATCHING_ENABLED:-false}
      CCTV_FACE_MATCH_SIMILARITY_THRESHOLD: ${CCTV_FACE_MATCH_SIMILARITY_THRESHOLD:-0.45}
      CCTV_FACE_MATCH_MINIMUM_MARGIN: ${CCTV_FACE_MATCH_MINIMUM_MARGIN:-0.05}
      CCTV_FACE_MATCH_UNKNOWN_RETRY_SECONDS: ${CCTV_FACE_MATCH_UNKNOWN_RETRY_SECONDS:-2}
      CCTV_FACE_IDENTITY_STITCH_MAX_GAP_SECONDS: ${CCTV_FACE_IDENTITY_STITCH_MAX_GAP_SECONDS:-12}
      CCTV_FACE_IDENTITY_STITCH_MIN_SIMILARITY: ${CCTV_FACE_IDENTITY_STITCH_MIN_SIMILARITY:-0.35}
      CCTV_FACE_IDENTITY_STITCH_MAX_DISTANCE_RATIO: ${CCTV_FACE_IDENTITY_STITCH_MAX_DISTANCE_RATIO:-6}
      CCTV_LOG_LEVEL: ${CCTV_LOG_LEVEL:-INFO}
      CCTV_LOG_PATH: /runtime/logs/cctv.jsonl
      CCTV_LOG_MAX_BYTES: ${CCTV_LOG_MAX_BYTES:-10485760}
      CCTV_LOG_BACKUP_COUNT: ${CCTV_LOG_BACKUP_COUNT:-5}
    volumes:
      - ${LOCAL_VIDEO_DIR:-../video}:/samples:ro
      - ./artifacts/models:/models:ro
      - ./runtime:/runtime

  rtsp-worker:
    profiles:
      - rtsp
    build:
      context: ./backend
    entrypoint:
      - uv
      - run
      - --no-sync
      - cctv-rtsp-worker
    command: []
    depends_on:
      mediamtx:
        condition: service_started
    environment:
      CCTV_APP_ENV: development
      CCTV_APP_MODE: ${CCTV_APP_MODE:-dry_run}
      CCTV_AI_DEVICE: cpu
      CCTV_ANALYSIS_FPS: ${CCTV_ANALYSIS_FPS:-2}
      CCTV_DETECTOR_ENABLED: ${CCTV_DETECTOR_ENABLED:-true}
      CCTV_DETECTOR_TYPE: ${CCTV_DETECTOR_TYPE:-yolo_onnx}
      CCTV_DETECTOR_INPUT_SIZE: ${CCTV_DETECTOR_INPUT_SIZE:-${CCTV_YOLO_INPUT_SIZE:-640}}
      CCTV_DETECTOR_CONFIDENCE_THRESHOLD: ${CCTV_DETECTOR_CONFIDENCE_THRESHOLD:-${CCTV_YOLO_CONFIDENCE_THRESHOLD:-0.25}}
      CCTV_DETECTOR_NMS_THRESHOLD: ${CCTV_DETECTOR_NMS_THRESHOLD:-${CCTV_YOLO_NMS_THRESHOLD:-0.45}}
      CCTV_DETECTION_CLASS_NAMES: ${CCTV_DETECTION_CLASS_NAMES:-person,car,cat,dog}
      CCTV_YOLO_ENABLED: ${CCTV_YOLO_ENABLED:-true}
      CCTV_YOLO_INPUT_SIZE: ${CCTV_YOLO_INPUT_SIZE:-640}
      CCTV_YOLO_CONFIDENCE_THRESHOLD: ${CCTV_YOLO_CONFIDENCE_THRESHOLD:-0.25}
      CCTV_YOLO_NMS_THRESHOLD: ${CCTV_YOLO_NMS_THRESHOLD:-0.45}
      CCTV_TRACKING_ENABLED: ${CCTV_TRACKING_ENABLED:-true}
      CCTV_TRACKER_CLASS_NAMES: ${CCTV_TRACKER_CLASS_NAMES:-person}
      CCTV_TRACKER_IOU_THRESHOLD: ${CCTV_TRACKER_IOU_THRESHOLD:-0.3}
      CCTV_TRACKER_MAX_MISSED_FRAMES: ${CCTV_TRACKER_MAX_MISSED_FRAMES:-10}
      CCTV_TRACKER_MAX_IDLE_SECONDS: ${CCTV_TRACKER_MAX_IDLE_SECONDS:-12}
      CCTV_PERSIST_DETECTIONS: ${CCTV_PERSIST_DETECTIONS:-true}
      CCTV_RULES_ENABLED: ${CCTV_RULES_ENABLED:-true}
      CCTV_HIPERWALL_DRY_RUN_ENABLED: ${CCTV_HIPERWALL_DRY_RUN_ENABLED:-true}
      CCTV_HIPERWALL_EXECUTOR_ENABLED: "false"
      HIPERWALL_DEFAULT_DISPLAY_SECONDS: ${HIPERWALL_DEFAULT_DISPLAY_SECONDS:-30}
      CCTV_MODEL_PATH: /models/${YOLO_MODEL_FILE:-model.onnx}
      CCTV_MODEL_CLASSES_PATH: ${CCTV_MODEL_CLASSES_PATH:-}
      CCTV_DATABASE_PATH: /runtime/cctv.db
      CCTV_SNAPSHOT_DIR: /runtime/snapshots
      CCTV_SNAPSHOT_JPEG_QUALITY: ${CCTV_SNAPSHOT_JPEG_QUALITY:-90}
      CCTV_FACE_DETECTION_MODEL_PATH: /models/face/face_detection_yunet_2026may.onnx
      CCTV_FACE_EMBEDDING_MODEL_PATH: /models/face/face_recognition_sface_2021dec.onnx
      CCTV_FACE_DETECTION_SCORE_THRESHOLD: ${CCTV_FACE_DETECTION_SCORE_THRESHOLD:-0.8}
      CCTV_FACE_DETECTION_NMS_THRESHOLD: ${CCTV_FACE_DETECTION_NMS_THRESHOLD:-0.3}
      CCTV_FACE_DETECTION_TOP_K: ${CCTV_FACE_DETECTION_TOP_K:-5000}
      CCTV_FACE_DETECTION_MAX_INPUT_DIMENSION: ${CCTV_FACE_DETECTION_MAX_INPUT_DIMENSION:-960}
      CCTV_FACE_MATCHING_ENABLED: ${CCTV_FACE_MATCHING_ENABLED:-false}
      CCTV_FACE_MATCH_SIMILARITY_THRESHOLD: ${CCTV_FACE_MATCH_SIMILARITY_THRESHOLD:-0.45}
      CCTV_FACE_MATCH_MINIMUM_MARGIN: ${CCTV_FACE_MATCH_MINIMUM_MARGIN:-0.05}
      CCTV_FACE_MATCH_UNKNOWN_RETRY_SECONDS: ${CCTV_FACE_MATCH_UNKNOWN_RETRY_SECONDS:-2}
      CCTV_FACE_IDENTITY_STITCH_MAX_GAP_SECONDS: ${CCTV_FACE_IDENTITY_STITCH_MAX_GAP_SECONDS:-12}
      CCTV_FACE_IDENTITY_STITCH_MIN_SIMILARITY: ${CCTV_FACE_IDENTITY_STITCH_MIN_SIMILARITY:-0.35}
      CCTV_FACE_IDENTITY_STITCH_MAX_DISTANCE_RATIO: ${CCTV_FACE_IDENTITY_STITCH_MAX_DISTANCE_RATIO:-6}
      CCTV_RTSP_WORKER_URL: rtsp://mediamtx:8554/camera
      CCTV_RTSP_SOURCE_NAME: ${CCTV_RTSP_SOURCE_NAME:-camera}
      CCTV_RTSP_OPEN_TIMEOUT_SECONDS: ${CCTV_RTSP_OPEN_TIMEOUT_SECONDS:-10}
      CCTV_RTSP_READ_TIMEOUT_SECONDS: ${CCTV_RTSP_READ_TIMEOUT_SECONDS:-10}
      CCTV_RTSP_RECONNECT_INITIAL_SECONDS: ${CCTV_RTSP_RECONNECT_INITIAL_SECONDS:-1}
      CCTV_RTSP_RECONNECT_MAX_SECONDS: ${CCTV_RTSP_RECONNECT_MAX_SECONDS:-30}
      CCTV_RTSP_RECONNECT_JITTER_RATIO: ${CCTV_RTSP_RECONNECT_JITTER_RATIO:-0.2}
      CCTV_RTSP_MAX_RETRIES: ${CCTV_RTSP_MAX_RETRIES:-20}
      CCTV_LOG_LEVEL: ${CCTV_LOG_LEVEL:-INFO}
      CCTV_LOG_PATH: /runtime/logs/cctv.jsonl
      CCTV_LOG_MAX_BYTES: ${CCTV_LOG_MAX_BYTES:-10485760}
      CCTV_LOG_BACKUP_COUNT: ${CCTV_LOG_BACKUP_COUNT:-5}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: rtsp_transport;tcp
    volumes:
      - ./artifacts/models:/models:ro
      - ./runtime:/runtime
    restart: unless-stopped

  rtsp-test-publisher:
    profiles:
      - rtsp-test
    image: bluenviron/mediamtx:1.19.3-ffmpeg
    entrypoint:
      - ffmpeg
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -nostdin
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /samples/${RTSP_TEST_VIDEO_FILE:-testvideo1.mp4}
      - -an
      - -c:v
      - libx264
      - -preset
      - veryfast
      - -tune
      - zerolatency
      - -g
      - "30"
      - -keyint_min
      - "30"
      - -sc_threshold
      - "0"
      - -pix_fmt
      - yuv420p
      - -rtsp_transport
      - tcp
      - -f
      - rtsp
      - rtsp://mediamtx:8554/camera
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - ${RTSP_TEST_VIDEO_DIR:-../video}:/samples:ro
    restart: on-failure

networks:
  mediamtx-control:
    internal: true
    ipam:
      config:
        - subnet: 172.31.255.0/29
