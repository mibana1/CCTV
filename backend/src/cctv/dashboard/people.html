<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사람 등록 · CCTV 테스트</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0b1118;
        --surface: #121b25;
        --surface-2: #182431;
        --line: #29394a;
        --text: #edf4fa;
        --muted: #8fa4b8;
        --accent: #32d6a0;
        --accent-2: #49a8ff;
        --danger: #ff6b72;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(50, 214, 160, .1), transparent 30rem),
          radial-gradient(circle at top right, rgba(73, 168, 255, .12), transparent 32rem),
          var(--background);
        color: var(--text);
        font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
      }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 60px; }
      header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
      h1 { margin: 0; font-size: clamp(1.65rem, 3vw, 2.35rem); letter-spacing: -.04em; }
      h2 { margin: 0 0 5px; font-size: 1.05rem; }
      p { color: var(--muted); }
      .eyebrow { color: var(--accent); margin: 0 0 8px; font-size: .78rem; font-weight: 800; letter-spacing: .12em; }
      .header-actions { display: grid; justify-items: end; gap: 10px; }
      .nav-link { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--text); background: var(--surface-2); font-size: .82rem; font-weight: 800; text-decoration: none; }
      .health { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .82rem; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #ffbd59; box-shadow: 0 0 14px currentColor; }
      .dot.ok { background: var(--accent); }
      .grid { display: grid; grid-template-columns: minmax(380px, .95fr) minmax(0, 1.05fr); gap: 20px; margin-top: 26px; align-items: start; }
      .panel { background: rgba(18, 27, 37, .94); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: 0 18px 55px rgba(0, 0, 0, .18); }
      .panel-heading { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
      .panel-heading small, .hint { color: var(--muted); font-size: .76rem; line-height: 1.5; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      label { display: grid; gap: 7px; color: var(--muted); font-size: .82rem; }
      input[type="text"], textarea { width: 100%; background: #0c141d; border: 1px solid var(--line); border-radius: 9px; color: var(--text); padding: 10px 12px; }
      textarea { min-height: 76px; resize: vertical; }
      input[type="file"] { width: 100%; color: var(--muted); }
      input[type="file"]::file-selector-button { margin-right: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); background: var(--surface-2); cursor: pointer; }
      .primary, .secondary { border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 800; }
      .primary { color: #04120e; background: var(--accent); }
      .secondary { color: var(--text); background: var(--surface-2); border: 1px solid var(--line); }
      button:disabled { cursor: not-allowed; opacity: .42; }
      .message { min-height: 22px; margin: 14px 0 0; color: var(--muted); font-size: .86rem; }
      .message.success { color: var(--accent); }
      .message.error { color: var(--danger); }
      .photo-picker { margin-top: 14px; padding: 14px; border: 1px dashed #456078; border-radius: 11px; background: rgba(9, 16, 24, .62); }
      .photo-picker strong { display: block; margin-bottom: 5px; }
      .photo-previews { display: grid; grid-template-columns: repeat(5, minmax(70px, 1fr)); gap: 9px; margin-top: 12px; }
      .photo-preview { position: relative; overflow: hidden; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 9px; background: #070c12; }
      .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
      .photo-preview span { position: absolute; inset: auto 0 0; overflow: hidden; padding: 5px 6px; color: white; background: rgba(0, 0, 0, .72); font-size: .66rem; text-overflow: ellipsis; white-space: nowrap; }
      .person-list { display: grid; gap: 9px; max-height: 610px; overflow: auto; }
      .person-item { display: grid; grid-template-columns: 42px 1fr auto; gap: 11px; align-items: center; padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
      .person-avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; color: var(--accent); background: rgba(50, 214, 160, .11); font-weight: 850; }
      .person-info { min-width: 0; }
      .person-info strong, .person-info small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .person-info small { margin-top: 4px; color: var(--muted); }
      .person-actions { display: flex; align-items: center; gap: 7px; }
      .status-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 6px 10px; color: var(--accent); background: rgba(50, 214, 160, .12); font-size: .75rem; font-weight: 800; }
      .status-badge.disabled { color: var(--danger); background: rgba(255, 107, 114, .12); }
      .danger { border: 1px solid rgba(255, 107, 114, .35); border-radius: 8px; padding: 6px 9px; color: var(--danger); background: rgba(255, 107, 114, .08); font-size: .75rem; font-weight: 800; }
      .empty { color: var(--muted); text-align: center; padding: 42px 10px; }
      @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
      @media (max-width: 560px) {
        .shell { width: min(100% - 20px, 1180px); padding-top: 18px; }
        header { display: block; }
        .header-actions { justify-items: start; margin-top: 14px; }
        .form-grid { grid-template-columns: 1fr; }
        .photo-previews { grid-template-columns: repeat(3, minmax(70px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">LOCAL · IDENTITY REGISTRATION</p>
          <h1>사람 등록</h1>
          <p>등록 사진에서 얼굴 특징을 생성해 CCTV 테스트의 인식 후보로 저장합니다.</p>
        </div>
        <div class="header-actions">
          <a class="nav-link" href="/test-dashboard">← CCTV 테스트 대시보드</a>
          <div class="health"><span id="health-dot" class="dot"></span><span id="health-text">API 확인 중</span></div>
        </div>
      </header>

      <section class="grid">
        <section class="panel">
          <div class="panel-heading">
            <div>
              <h2>새 사람 등록</h2>
              <small>사람 정보와 얼굴 사진을 한 번에 등록합니다.</small>
            </div>
          </div>
          <form id="person-form">
            <div class="form-grid">
              <label>이름<input id="person-name" type="text" maxlength="128" placeholder="예: 홍길동" autocomplete="name" required></label>
              <label>사번 · 식별 ID<input id="person-external-id" type="text" maxlength="128" placeholder="예: EMP-001" spellcheck="false"></label>
            </div>
            <div class="form-grid" style="margin-top: 12px">
              <label>부서<input id="person-department" type="text" maxlength="128" placeholder="예: 보안팀"></label>
              <label>설명<textarea id="person-description" maxlength="1000" placeholder="선택 입력"></textarea></label>
            </div>
            <div class="photo-picker">
              <strong>얼굴 사진 3~5장</strong>
              <p class="hint">한 사진에 한 사람의 얼굴만 정면에 가깝게 담긴 JPG 또는 PNG를 선택하세요. 파일당 최대 8 MiB입니다.</p>
              <input id="person-photos" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" multiple required>
              <div id="person-photo-previews" class="photo-previews"></div>
            </div>
            <button id="person-submit" class="primary" type="submit" style="margin-top: 14px">사람 등록하기</button>
          </form>
          <p id="person-message" class="message" role="status" aria-live="polite"></p>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <div>
              <h2>등록된 사람</h2>
              <small id="person-count">목록을 불러오는 중입니다.</small>
            </div>
            <button id="person-reload" class="secondary" type="button">새로고침</button>
          </div>
          <div id="person-list" class="person-list"><p class="empty">등록된 사람이 없습니다.</p></div>
        </section>
      </section>
    </main>

    <script>
      const state = { previewUrls: [] };

      async function api(path, options = {}) {
        const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          const detail = Array.isArray(body.detail)
            ? body.detail.map(item => item.msg || String(item)).join(", ")
            : body.detail;
          throw new Error(detail || `요청 실패 (${response.status})`);
        }
        if (response.status === 204) return null;
        return response.json();
      }

      const text = (id, value) => { document.getElementById(id).textContent = value; };

      async function checkHealth() {
        try {
          const health = await api("/health");
          document.getElementById("health-dot").classList.toggle("ok", health.status === "ok");
          text("health-text", `API 정상 · DB v${health.checks.database.schema_version}`);
        } catch (error) {
          text("health-text", error.message);
        }
      }

      function setMessage(message, kind = "") {
        const target = document.getElementById("person-message");
        target.textContent = message;
        target.className = `message${kind ? ` ${kind}` : ""}`;
      }

      function renderPhotoPreviews() {
        for (const url of state.previewUrls) URL.revokeObjectURL(url);
        state.previewUrls = [];
        const preview = document.getElementById("person-photo-previews");
        preview.replaceChildren();
        const files = Array.from(document.getElementById("person-photos").files || []);
        for (const file of files.slice(0, 5)) {
          const figure = document.createElement("div");
          figure.className = "photo-preview";
          const image = document.createElement("img");
          const url = URL.createObjectURL(file);
          state.previewUrls.push(url);
          image.src = url;
          image.alt = file.name;
          const caption = document.createElement("span");
          caption.textContent = file.name;
          figure.append(image, caption);
          preview.append(figure);
        }
        if (files.length > 5) setMessage("사진은 최대 5장까지 등록할 수 있습니다.", "error");
        else if (files.length > 0 && files.length < 3) setMessage(`사진을 ${3 - files.length}장 더 선택하세요.`, "error");
        else if (files.length >= 3) setMessage(`${files.length}장의 사진을 선택했습니다.`);
        else setMessage("");
      }

      function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
          reader.onerror = () => reject(new Error(`사진을 읽지 못했습니다: ${file.name}`));
          reader.readAsDataURL(file);
        });
      }

      async function loadIdentities() {
        const result = await api("/identities?limit=100");
        text("person-count", `${result.total.toLocaleString("ko-KR")}명 등록됨`);
        const list = document.getElementById("person-list");
        list.replaceChildren();
        if (!result.items.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "등록된 사람이 없습니다.";
          list.append(empty);
          return;
        }
        for (const person of result.items) {
          const item = document.createElement("div");
          item.className = "person-item";
          const avatar = document.createElement("div");
          avatar.className = "person-avatar";
          avatar.textContent = person.display_name.trim().slice(0, 1).toUpperCase();
          const info = document.createElement("div");
          info.className = "person-info";
          const name = document.createElement("strong");
          name.textContent = person.display_name;
          const detail = document.createElement("small");
          const department = person.metadata?.department;
          detail.textContent = [person.external_id, department].filter(Boolean).join(" · ") || "식별 정보 없음";
          info.append(name, detail);
          const badge = document.createElement("span");
          badge.className = `status-badge${person.enabled ? "" : " disabled"}`;
          badge.textContent = person.enabled ? "사용 중" : "중지";
          const actions = document.createElement("div");
          actions.className = "person-actions";
          const remove = document.createElement("button");
          remove.className = "danger";
          remove.type = "button";
          remove.textContent = "삭제";
          remove.addEventListener("click", () => deleteIdentity(person, remove));
          actions.append(badge, remove);
          item.append(avatar, info, actions);
          list.append(item);
        }
      }

      async function deleteIdentity(person, button) {
        const identifier = person.external_id ? ` (${person.external_id})` : "";
        if (!confirm(`${person.display_name}${identifier} 님을 삭제할까요? 등록 사진과 얼굴 특징도 함께 삭제됩니다.`)) return;
        button.disabled = true;
        setMessage(`${person.display_name} 님의 등록 정보를 삭제하고 있습니다.`);
        try {
          await api(`/test-identities/${encodeURIComponent(person.id)}`, { method: "DELETE" });
          setMessage(`${person.display_name} 님의 등록 정보를 삭제했습니다.`, "success");
          await loadIdentities();
        } catch (error) {
          button.disabled = false;
          setMessage(error.message, "error");
        }
      }

      document.getElementById("person-photos").addEventListener("change", renderPhotoPreviews);
      document.getElementById("person-reload").addEventListener("click", () => {
        loadIdentities().catch(error => text("person-count", error.message));
      });
      document.getElementById("person-form").addEventListener("submit", async event => {
        event.preventDefault();
        const form = event.currentTarget;
        const submit = document.getElementById("person-submit");
        const files = Array.from(document.getElementById("person-photos").files || []);
        setMessage("");
        if (files.length < 3 || files.length > 5) {
          setMessage("JPG 또는 PNG 얼굴 사진을 3~5장 선택하세요.", "error");
          return;
        }
        const unsupported = files.find(file => !/\.(jpe?g|png)$/i.test(file.name));
        if (unsupported) {
          setMessage(`지원하지 않는 사진 형식입니다: ${unsupported.name}`, "error");
          return;
        }
        const oversized = files.find(file => file.size > 8 * 1024 * 1024);
        if (oversized) {
          setMessage(`8 MiB를 초과한 사진입니다: ${oversized.name}`, "error");
          return;
        }
        submit.disabled = true;
        submit.textContent = "얼굴 분석 중…";
        setMessage("사진마다 얼굴이 한 명인지 확인하고 특징을 등록하고 있습니다.");
        try {
          const photos = await Promise.all(files.map(async file => ({
            file_name: file.name,
            content_base64: await readFileAsBase64(file)
          })));
          const department = document.getElementById("person-department").value.trim();
          const result = await api("/test-identities", {
            method: "POST",
            body: JSON.stringify({
              display_name: document.getElementById("person-name").value,
              external_id: document.getElementById("person-external-id").value.trim() || null,
              description: document.getElementById("person-description").value.trim() || null,
              metadata: department ? { department } : {},
              photos
            })
          });
          form.reset();
          renderPhotoPreviews();
          setMessage(`${result.display_name} 님의 얼굴 사진 ${result.photo_count}장을 등록했습니다.`, "success");
          await loadIdentities();
        } catch (error) {
          setMessage(error.message, "error");
        } finally {
          submit.disabled = false;
          submit.textContent = "사람 등록하기";
        }
      });

      checkHealth();
      loadIdentities().catch(error => text("person-count", error.message));
    </script>
  </body>
</html>
