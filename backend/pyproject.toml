[project]
name = "cctv"
version = "0.1.0"
description = "CCTV analysis API and Hiperwall integration backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
cctv = "cctv.main:run"
cctv-local-worker = "cctv.workers.local_video:run"
cctv-rtsp-worker = "cctv.workers.rtsp:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
